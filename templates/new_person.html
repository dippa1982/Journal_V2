{% extends "base.html" %}

{% block title %}Add Person{% endblock %}

{% block content %}

<div class="content-wrapper">

    <div class="page-header">

        <div>

            <h1>➕ Add Person</h1>

            <p>
                Add someone important in your life.
            </p>

        </div>

    </div>

    <div class="form-card">

        <form method="POST">

            <!-- ========================= -->
            <!-- Name -->
            <!-- ========================= -->

            <div class="mb-4">

                <label class="form-label">

                    Name

                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="e.g. Nicola"
                    required>

            </div>


            <!-- ========================= -->
            <!-- Relationship -->
            <!-- ========================= -->

            <div class="mb-4">

                <label class="form-label">

                    Relationship

                </label>

                <select
                    name="relationship_type"
                    class="form-select">

    {% for id, person in people_emojis.items() %}

        <option
            value="{{ id }}">

            {{ person.name }} {{person.emoji}}

        </option>

    {% endfor %}

                </select>

            </div>

            <!-- ========================= -->
            <!-- Colour -->
            <!-- ========================= -->

            <div class="mb-4">

                <label class="form-label">

                    Colour

                </label>

                <input
                    type="color"
                    name="colour"
                    value="#6d5dfc"
                    class="form-control form-control-color">

            </div>


            <!-- ========================= -->
            <!-- Notes -->
            <!-- ========================= -->

            <div class="mb-4">

                <label class="form-label">

                    Notes

                </label>

                <textarea
                    name="notes"
                    rows="6"
                    class="form-control"
                    placeholder="Things you'd like to remember about this person..."></textarea>

            </div>


            <!-- ========================= -->
            <!-- Favourite -->
            <!-- ========================= -->

            <div class="form-check mb-5">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="favourite"
                    name="favourite">

                <label
                    class="form-check-label"
                    for="favourite">

                    ⭐ Mark as Favourite

                </label>

            </div>


            <!-- ========================= -->
            <!-- Buttons -->
            <!-- ========================= -->

            <div class="d-flex gap-3">

                <button
                    type="submit"
                    class="btn btn-primary">

                    💾 Save Person

                </button>

                <a
                    href="{{ url_for('people.people') }}"
                    class="btn btn-outline-light">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
